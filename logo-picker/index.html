<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atmosphere — Logo Wall Picker</title>
<style>
  :root {
    --ink: #1b1d22;
    --paper: #f7f6f2;
    --panel: #ffffff;
    --line: #e4e1d8;
    --accent: #c65d33;
    --accent-soft: #f1ddd2;
    --muted: #75726a;

    --c-nonprofit: #3d6b5c;
    --c-government: #4a5a7d;
    --c-tech: #7a4fae;
    --c-media: #c65d33;
    --c-agency: #b08a2e;
    --c-energy: #b23b3b;
    --c-consumer: #2f7a8c;
    --c-enterprise: #545454;
    --c-education: #8a5c2e;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  header {
    flex: 0 0 auto;
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  header h1 {
    font-size: 21px;
    letter-spacing: 0.01em;
    margin: 0;
    font-weight: 650;
  }

  header .sub {
    color: var(--muted);
    font-size: 13px;
  }

  .status {
    font-size: 13px;
    color: var(--muted);
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(340px, 460px) 1fr;
    gap: 0;
    flex: 1 1 auto;
    min-height: 0;
  }

  .left {
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  .tally {
    flex: 0 0 auto;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .tally h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--muted);
    margin: 0 0 12px;
    font-weight: 600;
  }

  .tally-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 18px;
  }

  .tally-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }

  .swatch {
    width: 9px;
    height: 9px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .tally-name {
    flex: 1;
    color: var(--ink);
  }

  .tally-count {
    font-variant-numeric: tabular-nums;
    font-weight: 650;
    min-width: 18px;
    text-align: right;
    color: var(--muted);
  }

  .tally-count.active {
    color: var(--ink);
  }

  .filter-bar {
    flex: 0 0 auto;
    padding: 12px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .filter-bar select {
    flex: 1;
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
  }

  .filter-bar .clear-filter {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    white-space: nowrap;
  }

  .filter-bar .clear-filter:hover {
    color: var(--ink);
    border-color: var(--accent);
  }

  .filter-bar .clear-filter:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .list-empty {
    color: var(--muted);
    font-size: 13px;
    padding: 30px 14px;
    text-align: center;
    border: 1px dashed var(--line);
    border-radius: 10px;
    margin: 12px;
  }

  .list {
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 0;
    padding: 6px 8px;
  }

  .row {
    display: grid;
    grid-template-columns: 20px 30px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-radius: 8px;
  }

  .row:hover {
    background: #efece3;
  }

  .row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .logo-slot {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px dashed #cdc8b8;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .logo-slot:hover {
    border-color: var(--accent);
  }

  .logo-slot img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #fff;
  }

  .logo-slot .upload-icon {
    color: #a8a294;
    width: 14px;
    height: 14px;
  }

  .logo-slot .remove-btn {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 12px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 9px;
    line-height: 12px;
    text-align: center;
    border-radius: 0 0 0 4px;
    display: none;
  }

  .logo-slot:hover .remove-btn {
    display: block;
  }

  .row .name {
    font-size: 13.5px;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: default;
  }

  .chips {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
  }

  .chip {
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 100px;
    color: #fff;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .chip.secondary {
    opacity: 0.62;
  }

  .right {
    padding: 24px 28px 60px;
    overflow-y: auto;
    min-height: 0;
  }

  .right-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .right-head h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0;
    font-weight: 600;
  }

  .toggle-label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
  }

  .toggle-label input {
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .preview-window {
    background: #343757;
    border-radius: 14px;
    padding: 20px;
    min-height: calc(100vh - 220px);
  }

  .empty {
    color: #b7b9d1;
    font-size: 14px;
    padding: 60px 10px;
    text-align: center;
    border: 1px dashed rgba(255,255,255,0.22);
    border-radius: 12px;
  }

  .wall {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }

  .tile {
    aspect-ratio: 3 / 2;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    font-size: 13px;
    font-weight: 650;
    color: #fff;
    line-height: 1.25;
    letter-spacing: 0.01em;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  .tile.has-logo {
    background: none;
    box-shadow: none;
    padding: 14px;
  }

  .tile.has-logo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #ddd8ca; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Logo Wall Picker</h1>
    <div class="sub">Check organizations on the left to build the wall on the right. Click the square next to a name to upload its logo.</div>
  </div>
  <div class="status" id="statusLine">Loading…</div>
</header>

<div class="layout">
  <div class="left">
    <div class="tally">
      <h2>Industry Tally</h2>
      <div class="tally-grid" id="tallyGrid"></div>
    </div>
    <div class="filter-bar">
      <select id="categoryFilter">
        <option value="all">All industries</option>
      </select>
      <button class="clear-filter" id="clearFilterBtn" disabled>Clear</button>
    </div>
    <div class="list" id="list"></div>
  </div>
  <div class="right">
    <div class="right-head">
      <h2 id="wallCount">0 selected</h2>
      <label class="toggle-label">
        <input type="checkbox" id="showLogosToggle" checked>
        Show uploaded logos
      </label>
    </div>
    <div class="preview-window">
      <div id="wallArea"></div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWzFfhUVYnwM0_ITD-SIPzy3Anc18tQbg",
  authDomain: "logo-picker.firebaseapp.com",
  databaseURL: "https://logo-picker-default-rtdb.firebaseio.com",
  projectId: "logo-picker",
  storageBucket: "logo-picker.firebasestorage.app",
  messagingSenderId: "662398118855",
  appId: "1:662398118855:web:0cfccd9d9607bf9dd5c7e2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const selectionsRef = ref(db, 'selections');
const logosRef = ref(db, 'logos');
const showLogosRef = ref(db, 'settings/showLogos');

const CATEGORY_COLOR = {
  "Nonprofit": "var(--c-nonprofit)",
  "Government": "var(--c-government)",
  "Tech": "var(--c-tech)",
  "Media": "var(--c-media)",
  "Agency": "var(--c-agency)",
  "Energy": "var(--c-energy)",
  "Consumer": "var(--c-consumer)",
  "Enterprise": "var(--c-enterprise)",
  "Education": "var(--c-education)"
};

const CATEGORIES = Object.keys(CATEGORY_COLOR);

const COMPANIES = [
  ["AARP", "Nonprofit", ""],
  ["AOL", "Media", ""],
  ["American Chemical Society", "Nonprofit", ""],
  ["American University", "Education", ""],
  ["AquaBlu Mosaics", "Consumer", ""],
  ["BAHFSA (The Government of the Bahamas)", "Government", ""],
  ["Benjamin Moore Paint", "Enterprise", ""],
  ["Booz Allen", "Enterprise", "Government"],
  ["Choice Hotels (Cambria Suites)", "Enterprise", ""],
  ["CFA Society", "Nonprofit", ""],
  ["CQ Roll Call", "Media", "Government"],
  ["Datassentials", "Tech", ""],
  ["Deltek", "Tech", "Government"],
  ["US Department of Defense", "Government", ""],
  ["US Department of Energy", "Government", ""],
  ["DryyDC", "Consumer", ""],
  ["EDM Association", "Nonprofit", ""],
  ["First American", "Enterprise", ""],
  ["FSBPT", "Nonprofit", "Government"],
  ["Grand Bahama Port Authority", "Government", ""],
  ["HealthTrust", "Enterprise", ""],
  ["US Department of Health and Human Services", "Government", ""],
  ["International Medical Corps", "Nonprofit", ""],
  ["Joe Gibbs Racing", "Enterprise", ""],
  ["KCBI", "Media", "Nonprofit"],
  ["The Kennedy Center", "Nonprofit", "Government"],
  ["Georgetown University", "Education", ""],
  ["Maersk", "Enterprise", ""],
  ["NUBOXX", "Consumer", ""],
  ["Palantir", "Tech", "Government"],
  ["Payless Power", "Energy", ""],
  ["PBS", "Media", "Government"],
  ["Pinkston", "Agency", ""],
  ["Prison Fellowship International", "Nonprofit", ""],
  ["Saving Homes", "Nonprofit", ""],
  ["Scholastic", "Media", ""],
  ["Seastreak", "Consumer", ""],
  ["Semarchy", "Tech", ""],
  ["Sklar", "Consumer", ""],
  ["Software AG", "Tech", ""],
  ["Telos", "Tech", "Government"],
  ["Transportation and Security Agency (TSA)", "Government", ""],
  ["Tysons Tree", "Consumer", ""],
  ["USAID", "Government", ""],
  ["USDA Forest Services", "Government", ""],
  ["Washington West", "Media", ""],
  ["YoungLife", "Nonprofit", ""],
  ["YouVersion", "Nonprofit", ""],
  ["YWCA", "Nonprofit", ""]
];

let checked = {};
let logos = {};
let showLogos = true;
let pendingUploadName = null;
let activeFilter = null;

const filterSelect = document.getElementById('categoryFilter');
const clearFilterBtn = document.getElementById('clearFilterBtn');

CATEGORIES.forEach(cat => {
  const opt = document.createElement('option');
  opt.value = cat;
  opt.textContent = cat;
  filterSelect.appendChild(opt);
});

filterSelect.addEventListener('change', () => {
  activeFilter = filterSelect.value === 'all' ? null : filterSelect.value;
  clearFilterBtn.disabled = !activeFilter;
  renderList();
});

clearFilterBtn.addEventListener('click', () => {
  activeFilter = null;
  filterSelect.value = 'all';
  clearFilterBtn.disabled = true;
  renderList();
});

const UPLOAD_ICON_SVG = `<svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>`;

function chip(label, secondary) {
  const color = CATEGORY_COLOR[label] || "#999";
  return `<span class="chip${secondary ? ' secondary' : ''}" style="background:${color}">${label}</span>`;
}

function logoSlotHtml(name) {
  const safeName = name.replace(/"/g,'&quot;');
  const logoUrl = logos[name];
  if (logoUrl) {
    return `
      <div class="logo-slot" data-upload="${safeName}" title="Click to replace logo">
        <img src="${logoUrl}" alt="${safeName} logo">
        <span class="remove-btn" data-remove="${safeName}" title="Remove logo">×</span>
      </div>`;
  }
  return `
    <div class="logo-slot" data-upload="${safeName}" title="Click to upload logo">
      ${UPLOAD_ICON_SVG}
    </div>`;
}

function renderList() {
  const listEl = document.getElementById('list');
  const visible = COMPANIES.filter(([name, primary, secondary]) => {
    if (!activeFilter) return true;
    return primary === activeFilter || secondary === activeFilter;
  });

  if (visible.length === 0) {
    listEl.innerHTML = `<div class="list-empty">No organizations match this filter.</div>`;
    return;
  }

  listEl.innerHTML = visible.map(([name, primary, secondary]) => {
    const isChecked = !!checked[name];
    return `
      <div class="row">
        <input type="checkbox" data-name="${name.replace(/"/g,'&quot;')}" ${isChecked ? 'checked' : ''}>
        ${logoSlotHtml(name)}
        <span class="name">${name}</span>
        <span class="chips">${chip(primary, false)}${secondary ? chip(secondary, true) : ''}</span>
      </div>`;
  }).join('');

  listEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const name = e.target.getAttribute('data-name');
      set(ref(db, 'selections/' + name), e.target.checked);
    });
  });

  listEl.querySelectorAll('.logo-slot').forEach(slot => {
    slot.addEventListener('click', (e) => {
      if (e.target.hasAttribute('data-remove')) {
        e.stopPropagation();
        const name = e.target.getAttribute('data-remove');
        remove(ref(db, 'logos/' + name));
        return;
      }
      pendingUploadName = slot.getAttribute('data-upload');
      document.getElementById('fileInput').click();
    });
  });
}

function renderTally() {
  const counts = {};
  CATEGORIES.forEach(c => counts[c] = 0);

  COMPANIES.forEach(([name, primary, secondary]) => {
    if (!checked[name]) return;
    if (primary) counts[primary] = (counts[primary] || 0) + 1;
    if (secondary) counts[secondary] = (counts[secondary] || 0) + 1;
  });

  const grid = document.getElementById('tallyGrid');
  grid.innerHTML = CATEGORIES.map(cat => {
    const n = counts[cat] || 0;
    return `
      <div class="tally-row">
        <span class="swatch" style="background:${CATEGORY_COLOR[cat]}"></span>
        <span class="tally-name">${cat}</span>
        <span class="tally-count ${n > 0 ? 'active' : ''}">${n}</span>
      </div>`;
  }).join('');
}

function renderWall() {
  const selected = COMPANIES.filter(([name]) => checked[name]);
  document.getElementById('wallCount').textContent = `${selected.length} selected`;
  const wallArea = document.getElementById('wallArea');

  if (selected.length === 0) {
    wallArea.innerHTML = `<div class="empty">No organizations selected yet — check a few names on the left and their tiles will appear here.</div>`;
    return;
  }

  wallArea.innerHTML = `<div class="wall">${
    selected.map(([name, primary]) => {
      const logoUrl = logos[name];
      if (showLogos && logoUrl) {
        return `<div class="tile has-logo"><img src="${logoUrl}" alt="${name} logo"></div>`;
      }
      return `<div class="tile" style="background:${CATEGORY_COLOR[primary] || '#888'}">${name}</div>`;
    }).join('')
  }</div>`;
}

// Resize an uploaded image down to a reasonable max dimension before storing,
// so the shared database stays small and fast to sync.
function resizeImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 320;
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file || !pendingUploadName) return;

  const reader = new FileReader();
  reader.onload = async () => {
    try {
      if (file.type === 'image/svg+xml') {
        // SVGs are vector — store as-is, no rasterizing/resizing needed.
        set(ref(db, 'logos/' + pendingUploadName), reader.result);
        return;
      }
      const resized = await resizeImage(reader.result);
      set(ref(db, 'logos/' + pendingUploadName), resized);
    } catch (err) {
      console.error('Could not process image', err);
    }
  };
  reader.readAsDataURL(file);
});

document.getElementById('showLogosToggle').addEventListener('change', (e) => {
  set(showLogosRef, e.target.checked);
});

onValue(selectionsRef, (snapshot) => {
  checked = snapshot.val() || {};
  renderList();
  renderTally();
  renderWall();
  document.getElementById('statusLine').textContent = 'Live — synced with anyone viewing this page';
}, (error) => {
  document.getElementById('statusLine').textContent = 'Connection error — check console';
  console.error(error);
});

onValue(logosRef, (snapshot) => {
  logos = snapshot.val() || {};
  renderList();
  renderWall();
});

onValue(showLogosRef, (snapshot) => {
  const val = snapshot.val();
  showLogos = val === null ? true : val;
  document.getElementById('showLogosToggle').checked = showLogos;
  renderWall();
});
</script>

</body>
</html>
